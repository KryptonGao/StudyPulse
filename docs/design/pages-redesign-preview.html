<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分頁重設計預覽</title>
<style>
:root {
  --accent: #007AFF;
  --page: #e9e9ee; --page-ink: #1d1d1f; --page-muted: #6e6e73; --panel: #ffffff;
  --bg: #f2f2f7; --card: #ffffff; --fill: #f2f2f7; --fill2: #e5e5ea;
  --label: #000000; --label2: rgba(60,60,67,.62); --label3: rgba(60,60,67,.32);
  --sep: rgba(60,60,67,.12);
  --red: #FF3B30; --orange: #FF9500; --green: #34C759; --yellow: #FFCC00; --purple: #AF52DE; --pink: #FF2D55; --teal: #30B0C7; --indigo: #5856D6;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  --bar: rgba(249,249,249,.86);
}
:root[data-theme="dark"] {
  --page: #0b0b0d; --page-ink: #f5f5f7; --page-muted: #98989d; --panel: #161618;
  --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill2: #3a3a3c;
  --label: #ffffff; --label2: rgba(235,235,245,.62); --label3: rgba(235,235,245,.3);
  --sep: rgba(84,84,88,.55);
  --red: #FF453A; --orange: #FF9F0A; --green: #30D158; --yellow: #FFD60A; --purple: #BF5AF2; --pink: #FF375F; --teal: #40C8E0; --indigo: #5E5CE6;
  --shadow: none; --bar: rgba(30,30,32,.86);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--page-ink);
  font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang TC", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* ---------- Page chrome ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
  padding: 14px 24px; background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--sep);
}
.topbar h1 { font-size: 17px; margin: 0; font-weight: 700; }
.topbar h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--page-muted); margin-top: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.seg { display: inline-flex; background: var(--fill2); border-radius: 9px; padding: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--page-muted); }
.seg button.on { background: var(--panel); color: var(--page-ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.swatches { display: inline-flex; gap: 6px; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatches button.on { border-color: var(--page-ink); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--page-muted); cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 24px; align-items: start; max-width: 1800px; margin: 0 auto; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .layout { padding: 16px; } .topbar { padding: 12px 16px; } }
.stage { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; min-width: 0; }
.device-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.device-caption { font-size: 12px; font-weight: 600; color: var(--page-muted); letter-spacing: .02em; }
.scaler { transform-origin: top left; align-self: flex-start; }

.notes { background: var(--panel); border-radius: 18px; padding: 20px 20px 8px; position: sticky; top: 84px; max-height: calc(100vh - 108px); overflow: auto; border: 1px solid var(--sep); }
@media (max-width: 1100px) { .notes { position: static; max-height: none; } }
.notes h2 { font-size: 15px; margin: 0 0 4px; }
.notes p.lead { font-size: 13px; color: var(--page-muted); margin: 0 0 16px; line-height: 1.55; }
.note { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--sep); }
.note .n { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.note h3 { font-size: 14px; margin: 1px 0 4px; }
.note p { font-size: 12.5px; line-height: 1.55; margin: 0; color: var(--page-muted); }
.note code, .maprow code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; background: var(--fill); color: var(--page-ink); padding: 1px 5px; border-radius: 5px; }
.mapping { margin: 6px 0 14px; border-top: 1px solid var(--sep); padding-top: 14px; }
.mapping h2 { font-size: 15px; margin: 0 0 10px; }
.maprow { display: grid; grid-template-columns: 76px 1fr; gap: 8px; font-size: 12.5px; padding: 6px 0; line-height: 1.5; }
.maprow b { font-weight: 700; }
.maprow span { color: var(--page-muted); }
.shared { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--fill); font-size: 12.5px; line-height: 1.55; color: var(--page-muted); }
.shared b { color: var(--page-ink); }

/* ---------- Device frames ---------- */
.iphone { width: 393px; height: 852px; border-radius: 56px; background: #0a0a0a; padding: 11px; box-shadow: 0 0 0 2px #2a2a2c, 0 30px 60px rgba(0,0,0,.22); }
.ipad { width: 1194px; height: 834px; border-radius: 36px; background: #0a0a0a; padding: 14px; box-shadow: 0 0 0 2px #2a2a2c, 0 30px 60px rgba(0,0,0,.22); }
.screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--label); border-radius: 46px; }
.ipad .screen { border-radius: 24px; display: grid; grid-template-columns: 240px minmax(0, 1fr); }
.statusbar { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0; font-size: 16px; font-weight: 600; position: absolute; top: 0; left: 0; right: 0; z-index: 6; background: linear-gradient(var(--bg) 70%, transparent); }
.island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; }
.sb-icons { display: flex; gap: 6px; align-items: center; letter-spacing: -1px; }
.scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; padding: 58px 16px 120px; }
.scroll::-webkit-scrollbar, .col::-webkit-scrollbar { display: none; }
.tabbar {
  position: absolute; left: 14px; right: 14px; bottom: 26px; height: 62px; z-index: 7; border-radius: 31px;
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--bar); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: 0 0 0 .5px var(--sep), 0 8px 24px rgba(0,0,0,.10);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 600; color: var(--label2); }
.tab .ico { font-size: 22px; }
.tab.on { color: var(--accent); }
.homeind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--label); opacity: .85; z-index: 8; }

/* iPad split */
.ipad .statusbar { height: 30px; padding: 4px 22px 0; font-size: 13px; background: transparent; }
.detail { position: relative; overflow: hidden; display: grid; grid-template-columns: var(--cols, 400px minmax(0,1fr)); }
.col { position: relative; overflow-y: auto; scrollbar-width: none; padding: 34px 22px 110px; min-width: 0; }
.col + .col { border-left: 1px solid var(--sep); }
.col.tint { background: color-mix(in srgb, var(--card) 45%, var(--bg)); }
.sidebar { background: color-mix(in srgb, var(--card) 70%, var(--bg)); border-right: 1px solid var(--sep); padding: 46px 12px 16px; display: flex; flex-direction: column; gap: 2px; }
.sidebar h2 { font-size: 26px; font-weight: 800; margin: 0 10px 14px; }
.side-i { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; font-size: 16px; font-weight: 500; }
.side-i .ico { font-size: 19px; color: var(--accent); }
.side-i.on { background: var(--accent); color: #fff; }
.side-i.on .ico { color: #fff; }
.side-i .badge { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--label2); }
.side-i.on .badge { color: rgba(255,255,255,.85); }
.side-sp { flex: 1; }

/* ---------- App primitives ---------- */
.card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); position: relative; }
.zone { margin-top: 24px; }
.zone-h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 10px; }
.zone-h h2 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.zone-h a { font-size: 14px; color: var(--accent); text-decoration: none; font-weight: 500; }
.stack > * + * { margin-top: 12px; }
.muted { color: var(--label2); }
.tiny { font-size: 12px; } .small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 600; background: var(--fill); color: var(--label); white-space: nowrap; border: 0; }
.pill.accent { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex: none; }
.btn { border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; }
.btn-primary { background: var(--accent); color: #fff; height: 44px; border-radius: 14px; padding: 0 18px; font-size: 16px; }
.btn-soft { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); height: 34px; border-radius: 11px; padding: 0 12px; font-size: 14px; }
.btn-gray { background: var(--fill); color: var(--label); height: 34px; border-radius: 11px; padding: 0 12px; font-size: 14px; }
.chev { color: var(--label3); font-size: 13px; flex: none; }
.up { color: var(--green); } .down { color: var(--red); }
.bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; display: inline-block; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* annotations */
[data-anno] { position: relative; }
body.anno [data-anno]::after {
  content: attr(data-anno); position: absolute; top: -8px; right: -6px; z-index: 5;
  width: 22px; height: 22px; border-radius: 50%; background: #FF2D55; color: #fff;
  font: 700 12px/22px -apple-system, sans-serif; text-align: center; box-shadow: 0 0 0 2px var(--bg);
}
body.anno [data-anno] { outline: 1.5px dashed rgba(255,45,85,.55); outline-offset: 3px; border-radius: 20px; }

/* nav bar (large title) */
.navtop { display: flex; align-items: center; gap: 8px; height: 40px; }
.navtop .back { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; }
.navtop .sp { flex: 1; }
.gbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; color: var(--label); border: 0; background: var(--bar); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 0 .5px var(--sep), 0 2px 8px rgba(0,0,0,.06); }
.gbtn.pri { background: var(--accent); color: #fff; box-shadow: none; }
.ltitle { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin: 2px 4px 12px; }
.ltitle h1 { font-size: 34px; font-weight: 800; margin: 0; letter-spacing: -.02em; line-height: 1.1; }
.phase { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px; border-radius: 14px; font-size: 12.5px; font-weight: 600; background: var(--card); box-shadow: var(--shadow); white-space: nowrap; margin-bottom: 3px; }
.phase .dot { background: var(--accent); width: 7px; height: 7px; }
:root[data-theme="dark"] .phase { background: var(--fill); }

.search { display: flex; align-items: center; gap: 8px; height: 38px; border-radius: 12px; background: var(--fill2); padding: 0 12px; color: var(--label2); font-size: 16px; }
:root[data-theme="dark"] .search { background: var(--fill); }
.chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px; border-radius: 16px; font-size: 13.5px; font-weight: 600; background: var(--card); color: var(--label); border: 0; cursor: pointer; box-shadow: var(--shadow); }
.chip small { font-size: 12px; color: var(--label2); font-weight: 600; }
.chip.on { background: var(--accent); color: #fff; }
.chip.on small { color: rgba(255,255,255,.8); }
:root[data-theme="dark"] .chip:not(.on) { background: var(--fill); }
.segctl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill2); border-radius: 9px; padding: 2px; }
:root[data-theme="dark"] .segctl { background: var(--fill); }
.segctl button { border: 0; background: transparent; border-radius: 7px; height: 28px; font-size: 13px; font-weight: 600; color: var(--label2); cursor: pointer; white-space: nowrap; padding: 0 8px; }
.segctl button.on { background: var(--card); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
:root[data-theme="dark"] .segctl button.on { background: var(--fill2); }

/* generic list rows */
.list { padding: 2px 16px; }
.rw { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
.rw + .rw { border-top: 1px solid var(--sep); }
.rw .t { flex: 1; min-width: 0; }
.rw .t b { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rw .t span { display: block; font-size: 12.5px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.rw.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); margin: 0 -10px; padding: 12px 10px; border-radius: 12px; border-top-color: transparent; }
.rw.sel + .rw { border-top-color: transparent; }
.score { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 17px; min-width: 46px; }
.score small { display: block; font-size: 11px; font-weight: 700; }
.sq { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; flex: none; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--label3); flex: none; display: grid; place-items: center; cursor: pointer; color: #fff; font-size: 13px; }
.check.done { background: var(--green); border-color: var(--green); }
.rw.done .t b { color: var(--label3); text-decoration: line-through; font-weight: 500; }

.banner { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px; background: color-mix(in srgb, var(--orange) 14%, transparent); font-size: 13.5px; }
.banner .bi { color: var(--orange); font-size: 17px; }
.banner b { color: var(--orange); }
.banner .go { margin-left: auto; color: var(--orange); font-weight: 600; font-size: 13px; white-space: nowrap; }
.insight { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--purple) 12%, transparent), color-mix(in srgb, var(--accent) 12%, transparent)); font-size: 13.5px; line-height: 1.45; }
.ai { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; color: #fff; background: linear-gradient(135deg, var(--purple), var(--accent)); white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; }

/* ---------- Trends ---------- */
.hero-k { font-size: 12px; font-weight: 700; color: var(--label2); letter-spacing: .02em; }
.bignum { font-size: 40px; font-weight: 800; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.delta { font-size: 13px; font-weight: 700; }
.legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--label2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.watch { background: color-mix(in srgb, var(--orange) 9%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--orange) 30%, transparent), var(--shadow); }
.watch-h { display: flex; align-items: center; gap: 10px; }
.watch-h .sq { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }
.watch .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.fact { background: var(--card); border-radius: 12px; padding: 8px 10px; }
:root[data-theme="dark"] .fact { background: var(--fill); }
.fact .v { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fact .l { font-size: 11px; color: var(--label2); }
.inv-row { display: grid; grid-template-columns: 78px 1fr 58px; gap: 10px; align-items: center; font-size: 13.5px; padding: 6px 0; }
.inv-row .bar { height: 8px; border-radius: 4px; }
.inv-row b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 13px; }
.stat3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat3 .fact { background: var(--fill); }

/* ---------- Mistakes ---------- */
.review::before { content: ""; position: absolute; inset: 0; border-radius: 20px; background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%); pointer-events: none; }
.stackbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 12px 0 8px; }
.stackbar i { display: block; height: 100%; }
.weak2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.weak2 .card { padding: 14px; }
.weak2 .k { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.weak2 h4 { font-size: 15px; margin: 8px 0 4px; line-height: 1.3; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tools button { border: 0; background: var(--card); border-radius: 16px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow); cursor: pointer; }
.tools .di { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 18px; }
.thumb { width: 44px; height: 44px; border-radius: 10px; flex: none; background: repeating-linear-gradient(0deg, var(--fill) 0 5px, var(--fill2) 5px 6px); display: grid; place-items: center; font-size: 11px; color: var(--label2); font-weight: 700; }
.mastery { width: 34px; height: 34px; flex: none; }
.mcard h5 { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--label2); display: flex; align-items: center; gap: 6px; }
.mcard p { margin: 0; font-size: 15px; line-height: 1.6; }
.mcard .math { font-family: "Times New Roman", serif; font-style: italic; font-size: 16px; }
.mcard.reason { box-shadow: inset 3px 0 0 var(--orange), var(--shadow); }
.mcard.right { box-shadow: inset 3px 0 0 var(--green), var(--shadow); }
.mcard.wrong { box-shadow: inset 3px 0 0 var(--red), var(--shadow); }
.actionbar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 7; display: flex; gap: 4px; padding: 5px; border-radius: 26px; background: var(--bar); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); box-shadow: 0 0 0 .5px var(--sep), 0 8px 24px rgba(0,0,0,.10); white-space: nowrap; }
.actionbar button { border: 0; background: transparent; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.actionbar button.pri { background: linear-gradient(135deg, var(--purple), var(--accent)); color: #fff; }

/* ---------- Todo ---------- */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 10px 8px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 7px; border-radius: 14px; cursor: pointer; }
.wd span { font-size: 11px; color: var(--label2); font-weight: 600; }
.wd b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wd .dots { display: flex; gap: 3px; height: 5px; }
.wd .dots i { width: 5px; height: 5px; border-radius: 50%; }
.wd.on { background: var(--accent); color: #fff; }
.wd.on span { color: rgba(255,255,255,.8); }
.wd.on .dots i { background: #fff !important; }
.wd.today:not(.on) b { color: var(--accent); }
.dayh { display: flex; align-items: baseline; gap: 8px; margin: 22px 4px 8px; }
.dayh h3 { font-size: 17px; font-weight: 700; margin: 0; }
.dayh span { font-size: 13px; color: var(--label2); }
.dayh em { margin-left: auto; font-style: normal; font-size: 12px; color: var(--label2); font-weight: 600; }
.ag { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: stretch; }
.ag + .ag { margin-top: 8px; }
.ag .tm { text-align: right; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; padding-top: 14px; color: var(--label); }
.ag .tm small { display: block; font-weight: 500; color: var(--label2); font-size: 11px; }

  });
  if (target != null) g += `<line x1="${padL}" x2="${w}" y1="${y(target)}" y2="${y(target)}" stroke="var(--green)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${w}" y="${y(target) - 5}" text-anchor="end" font-size="10" font-weight="700" fill="var(--green)">目標 ${target}</text>`;
  const lab = labels.map((l, i) => `<text x="${padL + i / (labels.length - 1) * cw}" y="${h - 3}" text-anchor="${i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle'}" font-size="10" fill="var(--label2)">${l}</text>`).join('');
  const last = pts[pts.length - 1];
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">${g}
    <path d="${line} L${last[0]} ${ch} L${padL} ${ch}Z" fill="${color}" opacity=".12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots ? pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--card)" stroke="${color}" stroke-width="1.8"/>`).join('') : ''}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${color}" stroke="var(--card)" stroke-width="2"/>${lab}</svg>`;
}
function radar(vals, axes, size = 200, color = 'var(--orange)') {
  const cx = size / 2, cy = size / 2, R = size / 2 - 34, n = axes.length;
  const pt = (i, r) => [cx + r * Math.sin(2 * Math.PI * i / n), cy - r * Math.cos(2 * Math.PI * i / n)];
  let g = '';
  [.33, .66, 1].forEach(k => { g += `<polygon points="${axes.map((_, i) => pt(i, R * k).join(',')).join(' ')}" fill="none" stroke="var(--sep)"/>`; });
  axes.forEach((a, i) => {
    const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--sep)"/>`;
    const [lx, ly] = pt(i, R + 18); g += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="10.5" fill="var(--label2)">${a}</text>`;
  });
  const poly = vals.map((v, i) => pt(i, R * v).join(',')).join(' ');
  return `<svg width="100%" viewBox="0 0 ${size} ${size}" style="display:block;max-width:${size}px;margin:0 auto">${g}<polygon points="${poly}" fill="${color}" fill-opacity=".2" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>${vals.map((v, i) => { const [x, y] = pt(i, R * v); return `<circle cx="${x}" cy="${y}" r="3" fill="${color}"/>`; }).join('')}</svg>`;
}
function ring(p, color, size = 34, sw = 4, label = '') {
  const r = size / 2 - sw / 2, c = 2 * Math.PI * r;
  return `<svg class="mastery" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;flex:none">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-opacity=".18" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/>
    ${label ? `<text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-size="${size * .26}" font-weight="800" fill="var(--label)">${label}</text>` : ''}</svg>`;
}
const zoneH = (t, a = '') => `<div class="zone-h"><h2>${t}</h2>${a ? `<a>${a}</a>` : ''}</div>`;
const navTop = (btns, back = '') => `<div class="navtop">${back ? `<span class="back">${I('chevL')}${back}</span>` : ''}<span class="sp"></span>${btns.map(b => `<button class="gbtn ${b[1] || ''}" aria-label="${b[2] || ''}">${I(b[0])}</button>`).join('')}</div>`;
const lTitle = (t, phase = true) => `<div class="ltitle"><h1>${t}</h1>${phase ? `<span class="phase"><i class="dot"></i>高二上 · 期中衝刺 ${I('chevD', 'style="font-size:10px;opacity:.5"')}</span>` : ''}</div>`;

const PAGES = { trends, mistakes, todo, coach, settings };
const TABS = [['home', '主頁'], ['chart', '趨勢'], ['book', '錯題'], ['checklist', '待辦'], ['brain', '教練']];

/* ---------- Devices ---------- */
function iphone(page) {
  const tabbar = page === settings ? '' : `<nav class="tabbar">${TABS.map((t, i) => `<div class="tab ${i === page.tab ? 'on' : ''}">${I(t[0])}${t[1]}</div>`).join('')}</nav>`;
  return `<div class="device-wrap"><div class="scaler" data-w="393" data-h="852"><div class="iphone"><div class="screen">
    <div class="statusbar"><span>21:41</span><div class="island"></div><span class="sb-icons">●●● ▮</span></div>
    <div class="scroll" style="${page === settings ? 'padding-bottom:40px' : ''}">${page.iphone()}</div>
    ${tabbar}
    <div class="homeind"></div>
  </div></div></div><div class="device-caption">iPhone · 393 × 852${page === settings ? ' · 由主頁右上齒輪推入' : ''}</div></div>`;
}
function ipad(page) {
  const v = page.ipad();
  const side = TABS.map((t, i) => `<div class="side-i ${i === page.tab && page !== settings ? 'on' : ''}">${I(t[0])}${t[1]}</div>`).join('');
  return `<div class="device-wrap"><div class="scaler" data-w="1194" data-h="834"><div class="ipad"><div class="screen">
    <aside class="sidebar"><h2>StudyPulse</h2>${side}<div class="side-sp"></div><div class="side-i ${page === settings ? 'on' : ''}">${I('gear')}設定</div></aside>
    <div class="detail" style="--cols:${v.cols}">
      <div class="statusbar" style="grid-column:1/-1;position:absolute"><span>21:41  10月16日 週五</span><span class="sb-icons">●●● ▮</span></div>
      <div class="col">${v.a}</div>
      <div class="col ${v.bTint ? 'tint' : ''}">${v.b}</div>
    </div>
    ${v.overlay || ''}
  </div></div></div><div class="device-caption">iPad · 1194 × 834 · 列表 | 詳情</div></div>`;
}

/* ---------- Controls ---------- */
const ACCENTS = ['#007AFF', '#32ADE6', '#30B0C7', '#34C759', '#00C7BE', '#FF9500', '#FF2D55', '#AF52DE', '#5856D6'];
const state = { page: 'trends', device: 'both', theme: 'light', accent: ACCENTS[0] };
try { Object.assign(state, JSON.parse(localStorage.getItem('sp-pages-preview') || '{}')); } catch (e) {}
const q = new URLSearchParams(location.search);
['page', 'device', 'theme', 'accent'].forEach(k => { if (q.get(k)) state[k] = q.get(k); });
if (!PAGES[state.page]) state.page = 'trends';
const save = () => { try { localStorage.setItem('sp-pages-preview', JSON.stringify(state)); } catch (e) {} };

const sw = document.getElementById('swatches');
sw.innerHTML = ACCENTS.map(c => `<button style="background:${c}" data-c="${c}" aria-label="主色 ${c}"></button>`).join('');

function render() {
  const page = PAGES[state.page];
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.style.setProperty('--accent', state.accent);
  [['#pageSeg', 'page'], ['#deviceSeg', 'device'], ['#themeSeg', 'theme']].forEach(([sel, k]) =>
    document.querySelectorAll(sel + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === state[k])));
  [...sw.children].forEach(b => b.classList.toggle('on', b.dataset.c === state.accent));
  document.getElementById('subtitle').textContent = `${page.title}：${page.sub}`;
  document.getElementById('noteTitle').textContent = `${page.title} · 設計說明`;
  document.getElementById('noteLead').textContent = page.sub;
  document.getElementById('noteList').innerHTML = page.notes.map((n, i) => `<div class="note"><span class="n">${i + 1}</span><div><h3>${n[0]}</h3><p>${n[1]}</p></div></div>`).join('');
  document.getElementById('mapList').innerHTML = page.map.map(m => `<div class="maprow"><b>${m[0]}</b><span>${m[1]}</span></div>`).join('');
  const stage = document.getElementById('stage');
  stage.innerHTML = (state.device !== 'ipad' ? iphone(page) : '') + (state.device !== 'iphone' ? ipad(page) : '');
  wire(stage);
  fit();
}
function fit() {
  const stage = document.getElementById('stage');
  const avail = stage.clientWidth;
  stage.querySelectorAll('.scaler').forEach(s => {
    const w = +s.dataset.w + 4, h = +s.dataset.h + 4;
    const scale = Math.min(1, avail / w);
    s.style.transform = `scale(${scale})`;
    s.style.width = w + 'px'; s.style.height = h + 'px';
    s.parentElement.style.width = w * scale + 'px';
    s.style.marginBottom = (h * scale - h) + 'px';
  });
}
function wire(root) {
  root.querySelectorAll('[data-seg]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  }));
  root.querySelectorAll('[data-chips]').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    seg.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  }));
  root.querySelectorAll('.wd').forEach(d => d.addEventListener('click', () => {
    d.parentElement.querySelectorAll('.wd').forEach(x => x.classList.toggle('on', x === d));
  }));
  root.querySelectorAll('.check').forEach(c => c.addEventListener('click', () => {
    const row = c.closest('.rw, .agc, .cl'); const done = !c.classList.contains('done');
    c.classList.toggle('done', done); c.textContent = done ? '✓' : '';
    if (row) row.classList.toggle('done', done);
  }));
}
[['pageSeg', 'page'], ['deviceSeg', 'device'], ['themeSeg', 'theme']].forEach(([id, k]) =>
  document.getElementById(id).addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state[k] = b.dataset.v; save(); render(); window.scrollTo({ top: 0 }); } }));
sw.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.accent = b.dataset.c; save(); render(); } });
document.getElementById('annoToggle').addEventListener('change', e => document.body.classList.toggle('anno', e.target.checked));
window.addEventListener('resize', fit);
render();
</script>
