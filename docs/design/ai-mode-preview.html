</main>

<script>
(() => {
'use strict';
const icon = (name,cls='') => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const mark = () => '<svg class="mark" aria-hidden="true"><use href="#mark"/></svg>';
const escapeHTML = text => String(text).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const categories = [
  {id:'grades',name:'成绩趋势',icon:'chart',meta:'6 科'},
  {id:'mistakes',name:'错题本',icon:'book',meta:'待复习 12'},
  {id:'exams',name:'考试与计划',icon:'calendar',meta:'3 项'},
  {id:'time',name:'时间投入',icon:'clock',meta:''},
  {id:'health',name:'身心状态',icon:'heart',meta:''},
  {id:'diary',name:'学习日记',icon:'diary',meta:''}
];
const seedHistory = [
  {id:'math',title:'数学这次没考好，怎么调整',group:'今天',kind:'grades'},
  {id:'week',title:'期中考试前的两周计划',group:'今天',kind:'exams'},
  {id:'focus',title:'找到更适合我的学习节奏',group:'昨天',kind:'time'},
  {id:'physics',title:'物理受力分析，总是漏条件',group:'昨天',kind:'mistakes'},
  {id:'sleep',title:'最近有些累，想慢一点',group:'昨天',kind:'health'}
];
const storageKey='studypulse-ai-design-v1';
let stored=[];try {const parsed=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(parsed))stored=parsed.filter(x=>x&&typeof x.id==='string'&&typeof x.title==='string'&&Array.isArray(x.messages));}catch{}
let histories=[...stored,...seedHistory];
let apps=[];
const persist=()=>{try{localStorage.setItem(storageKey,JSON.stringify(histories.filter(x=>!seedHistory.some(y=>y.id===x.id)).slice(0,20)));}catch{} apps.forEach(app=>app.renderHistory());};
const plans = `<div class="chat-plan"><div class="plan-number">1</div><p><strong>先补函数，不急着刷整张卷。</strong>花 25 分钟重做最近 3 道函数错题，把漏掉的条件写在题旁。</p></div><div class="chat-plan"><div class="plan-number">2</div><p><strong>留一点时间，确认自己会了。</strong>明天再做 2 道同类题，看看能不能独立说清每一步。</p></div>`;
const replies={
grades:`<p>先别急着否定自己。我看了你最近的成绩，<strong>数学还在进步，只是函数这一块需要多一点耐心。</strong></p><div class="inline-grade"><div class="inline-grade-top">最近一次 · 数学 <button class="source-link" data-open="grades">查看成绩 ${icon('arrow')}</button></div><strong>112 <span>/ 150</span></strong><div class="inline-foot">比上次提高 8 分 · 近三次持续上升</div></div><p>最近 12 道待复习错题里，有 5 道涉及函数。与其重新学一遍，不如把精力放在这一个薄弱点。</p><h3>今晚，先做两件小事。</h3>${plans}<button class="follow-up" data-prompt="帮我把函数复习拆成 25 分钟的任务">把这 25 分钟，安排得具体一点 ${icon('arrow')}</button>`,
mistakes:`<p>我整理了最近的错题。<strong>先处理重复出现的问题，会比一口气重做所有题更有效。</strong></p><h3>从函数的 5 道错题开始。</h3><p>这几道题共同卡在定义域和分类讨论。复习时，先用一句话写出「题目给了什么条件」，再开始计算。</p>${plans}<button class="follow-up" data-open="mistakes">打开待复习错题 ${icon('arrow')}</button>`,
exams:`<p>距离数学期中考还有 <strong>8 天</strong>。可以先分成三个小阶段，让复习更容易开始。</p><h3>先补缺口，再做整合。</h3><div class="chat-plan"><div class="plan-number">1</div><p><strong>10 月 17–19 日 · 函数专项</strong>每天留 25 分钟，先完成 5 道函数错题，再补 2 道同类题。</p></div><div class="chat-plan"><div class="plan-number">2</div><p><strong>10 月 20–23 日 · 交替练习</strong>函数与数列交替复习，每天一组限时训练。</p></div><div class="chat-plan"><div class="plan-number">3</div><p><strong>10 月 24 日 · 轻量回顾</strong>回看易错条件，整理公式，把晚上留给休息。</p></div><button class="follow-up" data-open="exams">查看考试与计划 ${icon('arrow')}</button>`,
time:`<p>这周你已经专注学习 <strong>12 小时 35 分钟</strong>。数学占了最多时间，但不必用更长的学习来解决所有问题。</p><h3>让每段投入更有方向。</h3><p>可以试试一个 25 分钟的小循环：5 分钟回顾错因、15 分钟独立重做、5 分钟总结。结束后休息，再决定要不要继续。</p><button class="follow-up" data-open="time">看看这一周的时间分配 ${icon('arrow')}</button>`,
health:`<p>最近的睡眠记录比你的平时稍短。今晚可以先安排<strong>一轮 25 分钟的轻量复习</strong>，结束后再看看自己的感觉。</p><h3>今天，也可以慢一点。</h3><p>挑两道熟悉的错题回顾，整理已经掌握的思路。学习不一定每天都要加量，适合你的节奏更重要。</p><button class="follow-up" data-open="health">查看最近的身心状态 ${icon('arrow')}</button>`,
diary:`<p>你在昨天的日记里写到：「做不出来的时候，容易觉得自己什么都不会。」</p><h3>把感受和事实，分开看一看。</h3><p>最近三次数学成绩一直在上升，也有几道以前不会的题已经能独立完成。一次卡住，并不能概括你的全部进展。</p><p>今晚不妨记下：今天弄懂的一件小事。小进步也值得留下来。</p><button class="follow-up" data-open="diary">回到学习日记 ${icon('arrow')}</button>`
};
function kindFor(text){if(/错题|物理|受力/.test(text))return'mistakes';if(/考试|计划|复习周|两周|这周的复习/.test(text))return'exams';if(/身|睡|累|适合怎么学|休息/.test(text))return'health';if(/时间|节奏|专注/.test(text))return'time';if(/日记|心情/.test(text))return'diary';return'grades';}
class AIApp{
 constructor(root,index){this.root=root;this.index=index;this.scene='welcome';this.context=null;this.messages=[];this.activeId=null;this.mode='深度思考';this.period=0;this.menu=null;this.generating=false;this.timer=null;this.lastChat=null;this.search='';this.renderShell();this.bind();this.renderHistory();if(root.dataset.initial==='drawer')this.setDrawer(true,false);if(root.dataset.initial==='grades')this.openData('grades');}
 q(selector){return this.root.querySelector(selector)}
 renderShell(){this.root.innerHTML=`<div class="statusbar" aria-hidden="true"><span>19:29</span><div class="status-icons"><svg viewBox="0 0 18 14" fill="currentColor"><rect x="1" y="9" width="3" height="5" rx="1"/><rect x="5.5" y="6" width="3" height="8" rx="1"/><rect x="10" y="3" width="3" height="11" rx="1"/><rect x="14.5" width="3" height="14" rx="1"/></svg><svg viewBox="0 0 20 15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M2 4c4.5-4 11.5-4 16 0M5 8c3-2.5 7-2.5 10 0M8.5 12c1-.8 2-.8 3 0"/></svg><span class="battery"><i></i></span></div></div><aside class="sidebar" aria-label="数据与对话历史" inert><div class="sidebar-top"><div class="wordmark">StudyPulse</div><button class="round" data-action="search" aria-label="搜索对话">${icon('search')}</button></div><div class="sidebar-body"><div class="search-wrap" hidden><input type="search" placeholder="搜索对话" aria-label="搜索对话历史"></div><div class="section-label">我的学习</div><nav class="data-nav" aria-label="学习数据">${categories.map(c=>`<button data-open="${c.id}">${icon(c.icon)}<span>${c.name}</span><span class="nav-meta">${c.meta}</span></button>`).join('')}</nav><div class="sidebar-divider"></div><div class="section-label history-heading">对话历史</div><div class="history-list"></div></div><div class="sidebar-footer"><div class="avatar" aria-label="Chen 的空间">C</div><button class="new-chat" data-action="new">${icon('plus')}新的对话</button></div></aside><section class="main-panel"><header class="panel-header"></header><div class="content-scroll"></div><div class="composer-area"></div><div class="data-action-wrap" hidden></div><button class="drawer-dismiss" data-action="close-drawer" aria-label="收起侧栏"></button></section><div class="home-indicator" aria-hidden="true"></div><div class="toast" role="status"></div>`;this.render();}

 render(){this.header();const data=categories.find(c=>c.id===this.scene);this.q('.composer-area').hidden=!!data;this.q('.data-action-wrap').hidden=!data;if(data){this.renderData();return;}if(this.scene==='welcome'){this.q('.content-scroll').innerHTML=`<div class="welcome"><div class="greeting">${mark()}<h1>晚上好，Chen。<br><span>今天想从哪里开始？</span></h1><p>关于学习，我们一起慢慢理清。</p></div><div class="starters"><button class="starter" data-prompt="帮我分析最近的成绩">分析最近的成绩 ${icon('arrow')}</button><button class="starter" data-prompt="安排这周的复习">安排这周的复习 ${icon('arrow')}</button><button class="starter" data-prompt="今天适合怎么学？">今天适合怎么学 ${icon('arrow')}</button></div></div>`;}else{this.renderChat();}this.renderComposer();}

 renderHistory(){const list=this.q('.history-list');if(!list)return;let group='';let filtered=histories.filter(h=>h.title.toLowerCase().includes(this.search.toLowerCase()));list.innerHTML=filtered.length?filtered.map(h=>{let html='';if(h.group!==group){group=h.group;html=`<div class="history-sub">${escapeHTML(group||'今天')}</div>`;}return html+`<button class="history-item ${this.activeId===h.id?'active':''}" data-history="${escapeHTML(h.id)}">${icon('chat')}<span class="history-title" title="${escapeHTML(h.title)}">${escapeHTML(h.title)}</span></button>`;}).join(''):'<div class="search-empty">没有找到相关对话<br>试试「数学」或「复习」</div>';}
 setDrawer(open,moveFocus=true){this.closeMenu();this.root.classList.toggle('drawer-open',open);this.q('.sidebar').inert=!open;this.q('.panel-header').inert=open;this.q('.content-scroll').inert=open;this.q('.composer-area').inert=open;this.q('.data-action-wrap').inert=open;const menu=this.q('[data-action="drawer"]');if(menu)menu.setAttribute('aria-expanded',String(open));if(open&&moveFocus){this.focusBeforeDrawer=document.activeElement;this.q('.sidebar [data-action="search"]').focus({preventScroll:true});}else if(this.root.contains(document.activeElement)&&document.activeElement.closest('.sidebar')){this.q('.panel-header button').focus({preventScroll:true});}}
 openData(id){if(!categories.some(c=>c.id===id))return;this.draft=this.q('textarea')?.value||this.draft||'';this.scene=id;this.closeMenu();this.setDrawer(false);this.render();this.q('.content-scroll').scrollTop=0;}
 chart(){const series=[{points:'0,91 46,82 92,96 138,55 184,65 230,31 280,18',fill:'0,91 46,82 92,96 138,55 184,65 230,31 280,18 280,127 0,127',labels:['09.18','09.24','10.01','10.08','10.17'],avg:'82.6',delta:'+4.2',scores:[112,128,86]},{points:'0,108 46,101 92,80 138,87 184,56 230,39 280,18',fill:'0,108 46,101 92,80 138,87 184,56 230,39 280,18 280,127 0,127',labels:['09.01','09.14','09.28','10.10','10.17'],avg:'80.4',delta:'+6.7',scores:[109,125,85]},{points:'0,112 46,92 92,101 138,78 184,70 230,38 280,18',fill:'0,112 46,92 92,101 138,78 184,70 230,38 280,18 280,127 0,127',labels:['上学期','06.01','07.01','09.01','10.17'],avg:'78.9',delta:'+9.3',scores:[106,122,83]}][this.period];return {series,html:`<div class="chart" role="img" aria-label="标准化平均成绩趋势，整体上升，当前 ${series.avg} 分"><svg viewBox="0 0 286 157"><defs><linearGradient id="area-${this.index}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a6b294" stop-opacity=".27"/><stop offset="100%" stop-color="#a6b294" stop-opacity=".015"/></linearGradient></defs><path class="grid" d="M0 26h280M0 74h280M0 122h280"/><polygon points="${series.fill}" fill="url(#area-${this.index})"/><polyline points="${series.points}" fill="none" stroke="#7b8e65" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="18" r="4" fill="#7b8e65" stroke="#faf9f6" stroke-width="2.5"/>${series.labels.map((l,i)=>`<text x="${[0,64,133,204,280][i]}" y="151" text-anchor="${i===0?'start':i===4?'end':'middle'}">${l}</text>`).join('')}</svg><div class="chart-note"><span><i class="mini-dot"></i>标准化平均分</span><span>按满分 100 换算</span></div></div>`};}
 renderData(){const c=categories.find(x=>x.id===this.scene);let inner='';if(c.id==='grades'){const chart=this.chart();inner=`<p class="data-eyebrow">${['9 月 18 日 — 10 月 17 日','9 月 1 日 — 10 月 17 日','所有学习阶段'][this.period]}</p><h1 class="data-heading">每一点进步，都算数。</h1><div class="period-tabs" role="tablist" aria-label="成绩时间范围"><i class="period-indicator" style="transform:translateX(${this.period*100}%)"></i>${['近 30 天','本学期','全部'].map((t,i)=>`<button role="tab" aria-selected="${this.period===i}" class="${this.period===i?'active':''}" data-period="${i}">${t}</button>`).join('')}</div><div class="score-summary"><div><div class="big-number">${chart.series.avg}<small>分</small></div><span class="metric-label">标准化平均分</span></div><div class="delta">${icon('trend')}${chart.series.delta} ${['较上期','较上学期','较初始'][this.period]}</div></div>${chart.html}<div class="data-subtitle"><h3>各科表现</h3><span>最近一次成绩</span></div><div class="subject-rows">${[['数学',112,150,'+8'],['英语',128,150,'+5'],['物理',86,100,'−2']].map(s=>`<div class="subject-row"><div class="subject-name"><span class="subject-line"></span>${s[0]}</div><div class="subject-value">${s[1]}<small> / ${s[2]}</small></div><div class="subject-delta ${s[3].startsWith('−')?'down':''}">${s[3]}</div></div>`).join('')}</div><div class="data-insight">${mark()}<p>数学近三次持续进步。函数仍有 5 道待复习错题，值得花点时间巩固。</p></div>`;}else if(c.id==='mistakes'){inner=`<p class="data-eyebrow">间隔复习 · 今天</p><h1 class="data-heading">把不会的，慢慢变会。</h1><div class="stat-pair"><div><div class="big-number">12<small>道</small></div><span class="metric-label">今天待复习</span></div><div><div class="big-number">38<small>道</small></div><span class="metric-label">已经掌握</span></div></div><div class="data-subtitle"><h3>优先复习</h3><span>按薄弱程度</span></div><div class="data-list">${this.records([['book','函数的定义域与值域','数学 · 5 道错题 · 最近错误 10.15','待巩固'],['book','受力分析与运动过程','物理 · 4 道错题 · 最近错误 10.14','待巩固'],['book','非谓语动词的使用','英语 · 3 道错题 · 最近错误 10.12','待复习']])}</div>`;}else if(c.id==='exams'){inner=`<p class="data-eyebrow">10 月 17 日 · 星期六</p><h1 class="data-heading">给接下来的日子，<br>一点方向。</h1><div class="data-simple-stat"><div class="big-number">8<small>天</small></div><span class="metric-label">距离下一场考试</span></div><div class="data-subtitle"><h3>即将到来</h3><span>本学期</span></div><div class="data-list">${this.records([['calendar','数学 · 期中考试','10 月 25 日 · 09:00–11:00','8 天后'],['calendar','英语 · 单元测验','10 月 28 日 · 14:00–15:30','11 天后'],['calendar','物理 · 期中考试','10 月 30 日 · 09:00–10:30','13 天后']])}</div><div class="data-insight">${mark()}<p>数学考试最先到来。可以先回顾函数和数列，再安排一轮综合练习。</p></div>`;}else if(c.id==='time'){inner=`<p class="data-eyebrow">10 月 12 日 — 10 月 18 日</p><h1 class="data-heading">认真投入的时间，<br>都有迹可循。</h1><div class="score-summary"><div><div class="big-number">12<small>小时</small>35<small>分</small></div><span class="metric-label">本周专注时长</span></div></div><div class="time-bars" role="img" aria-label="本周专注时间，周一到周六分别为 95、125、80、145、130、180 分钟">${[53,69,44,81,72,100,0].map((n,i)=>`<div class="time-bar" style="height:${n}%"><span>${['一','二','三','四','五','六','日'][i]}</span></div>`).join('')}</div><div class="data-subtitle"><h3>时间去向</h3><span>本周</span></div>${this.records([['clock','数学专项','函数与数列','5 小时 10 分'],['clock','英语积累','阅读与词汇','4 小时 05 分'],['clock','物理巩固','力学基础','3 小时 20 分']])}`;}else if(c.id==='health'){inner=`<p class="data-eyebrow">今天 · 10 月 17 日</p><h1 class="data-heading">学习之前，<br>先关照一下自己。</h1><div class="data-simple-stat"><div class="big-number">76<small>/ 100</small></div><span class="metric-label">今日学习准备度 · 适合适中强度</span></div><div class="health-grid"><div class="health-cell"><label>昨晚睡眠</label><strong>6.8<small>小时</small></strong></div><div class="health-cell"><label>HRV</label><strong>48<small>ms</small></strong></div><div class="health-cell"><label>静息心率</label><strong>62<small>次 / 分</small></strong></div><div class="health-cell"><label>今日活动</label><strong>28<small>分钟</small></strong></div></div><div class="data-insight">${mark()}<p>昨晚比平时少睡了 40 分钟。今晚不妨少排一点任务，给休息留些余地。</p></div>`;}else{inner=`<p class="data-eyebrow">10 月 16 日 · 星期五</p><h1 class="data-heading">那些小小的心事，<br>也有地方安放。</h1><span class="diary-mood">有一点疲惫</span><p class="diary-paragraph">今天做数学的时候又卡住了。做不出来的时候，容易觉得自己什么都不会。</p><p class="diary-paragraph">但回头翻了上周的错题，发现有两道已经可以独立做出来了。也许，进步只是比想象中慢一点。</p><div class="data-insight">${mark()}<p>这是你连续记录的第 6 天。回头看看，也许能发现自己没注意到的变化。</p></div>`;}
 this.q('.content-scroll').innerHTML=`<article class="data-content">${inner}</article>`;this.q('.data-action-wrap').innerHTML=`<button class="data-action" data-action="ask-data">${mark()}聊聊我的${c.id==='grades'?'成绩':c.id==='mistakes'?'错题':c.id==='exams'?'复习计划':c.name}${icon('arrow')}</button>`;}
 records(rows){return rows.map(r=>`<div class="record"><div class="record-icon">${icon(r[0])}</div><div class="record-text"><h4>${r[1]}</h4><p>${r[2]}</p></div><span class="record-side">${r[3]}</span></div>`).join('');}
 renderChat(){this.q('.content-scroll').innerHTML=`<div class="chat-content" role="log" aria-label="对话内容">${this.messages.map((m,i)=>m.role==='user'?`<div class="user-message">${m.context?`<div class="message-context">${icon(m.context.icon)}${m.context.name}</div>`:''}${escapeHTML(m.text)}</div>`:`<div class="assistant-message"><div class="assistant-heading">${mark()}StudyPulse</div>${m.html}<div class="message-actions"><button data-copy="${i}" aria-label="复制这条回答">${icon('copy')}</button><button data-like="${i}" aria-label="${m.liked?'取消有帮助':'回答有帮助'}" aria-pressed="${!!m.liked}" style="${m.liked?'color:var(--green)':''}">${icon(m.liked?'check':'like')}</button><span class="response-time">${this.mode}</span></div></div>`).join('')}${this.generating?`<div class="thinking" role="status">${mark()}正在整理你的学习记录<span class="thinking-dots"><i></i><i></i><i></i></span></div>`:''}</div>`;}
 newChat(){this.stop(false);this.messages=[];this.activeId=null;this.context=null;this.chatTitle='';this.draft='';this.lastChat=null;if(this.q('textarea'))this.q('textarea').value='';this.scene='welcome';this.setDrawer(false);this.render();this.renderHistory();this.q('.content-scroll').scrollTop=0;}
 loadHistory(id){const h=histories.find(x=>x.id===id);if(!h)return;this.stop(false);this.activeId=id;this.context=null;this.chatTitle=h.title;this.messages=h.messages?JSON.parse(JSON.stringify(h.messages)):[{role:'user',text:h.title},{role:'assistant',html:replies[h.kind]}];this.scene='chat';this.setDrawer(false);this.render();this.renderHistory();this.q('.content-scroll').scrollTop=0;}
 send(text){text=text.trim();if(!text||this.generating)return;if(this.q('textarea'))this.q('textarea').value='';this.draft='';const kind=this.context?.id||kindFor(text);const requestContext=this.context?{...this.context}:null;this.messages.push({role:'user',text,context:requestContext});if(!this.activeId||seedHistory.some(x=>x.id===this.activeId)){this.activeId=`chat-${Date.now()}-${this.index}`;this.chatTitle=text.length>19?text.slice(0,19)+'…':text;}this.scene='chat';this.generating=true;this.context=null;this.setDrawer(false);this.render();this.saveConversation();this.scrollBottom();this.timer=setTimeout(()=>{this.generating=false;this.messages.push({role:'assistant',html:replies[kind]});this.saveConversation();if(this.scene==='chat'){this.renderChat();this.renderComposer();}},850);}
 saveConversation(){const h={id:this.activeId,title:this.chatTitle,group:'今天',messages:JSON.parse(JSON.stringify(this.messages))};const i=histories.findIndex(x=>x.id===this.activeId);if(i>=0)histories[i]=h;else histories.unshift(h);persist();}
 stop(render=true){if(!this.generating)return;clearTimeout(this.timer);this.timer=null;this.generating=false;if(this.activeId)this.saveConversation();if(render){this.renderChat();this.renderComposer();this.toast('已停止回答');}}
 scrollBottom(){requestAnimationFrame(()=>{this.q('.content-scroll').scrollTop=this.q('.content-scroll').scrollHeight;});}

 openMenu(type){if(this.menu===type){this.closeMenu();return;}this.closeMenu();this.menu=type;let div=document.createElement('div');div.className='popover';div.setAttribute('role','dialog');div.setAttribute('aria-label',type==='attach'?'引用学习数据':'回答方式');div.innerHTML=type==='attach'?`<h3>让对话多一点上下文</h3>${categories.map(c=>`<button type="button" data-context="${c.id}">${icon(c.icon)}${c.name}${this.context?.id===c.id?icon('check','check'):''}</button>`).join('')}`:`<h3>回答方式</h3>${[['深度思考','结合学习记录，认真想一想'],['快速回答','简洁直接，轻松聊聊']].map(([m,d])=>`<button type="button" data-mode="${m}"><span>${m}<span class="popover-description">${d}</span></span>${this.mode===m?icon('check','check'):''}</button>`).join('')}`;this.q('.composer-area').append(div);this.q('[data-action="model"]')?.setAttribute('aria-expanded',String(type==='model'));}
 toast(text){const el=this.q('.toast');el.textContent=text;el.classList.add('show');clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}
 preset(scene){this.newChat();if(scene==='drawer')this.setDrawer(true,false);else if(scene==='grades')this.openData('grades');else if(scene==='chat')this.loadHistory('math');}
 bind(){this.root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(b.dataset.open){this.openData(b.dataset.open);return;}if(b.dataset.history){this.loadHistory(b.dataset.history);return;}if(b.dataset.prompt){this.send(b.dataset.prompt);return;}if(b.dataset.period!==undefined){this.period=Number(b.dataset.period);this.renderData();return;}if(b.dataset.context){this.context=categories.find(c=>c.id===b.dataset.context);this.closeMenu();this.renderComposer();this.q('textarea').focus();return;}if(b.dataset.mode){this.mode=b.dataset.mode;this.closeMenu();this.renderComposer();return;}if(b.dataset.copy!==undefined){const m=this.messages[Number(b.dataset.copy)];let div=document.createElement('div');div.innerHTML=m.html;const text=div.textContent;try{await navigator.clipboard.writeText(text);this.toast('已复制回答');}catch{this.toast('请在浏览器中选择文字复制');}return;}if(b.dataset.like!==undefined){let m=this.messages[Number(b.dataset.like)];m.liked=!m.liked;if(this.activeId&&!seedHistory.some(h=>h.id===this.activeId))this.saveConversation();this.renderChat();return;}if(action==='drawer')this.setDrawer(true);if(action==='close-drawer')this.setDrawer(false);if(action==='new')this.newChat();if(action==='back'){this.scene=this.messages.length?'chat':'welcome';this.render();}if(action==='search'){const search=this.q('.search-wrap');search.hidden=!search.hidden;if(!search.hidden)search.querySelector('input').focus();else{search.querySelector('input').value='';this.search='';this.renderHistory();}}if(action==='ask-data'){this.context=categories.find(c=>c.id===this.scene);this.scene=this.messages.length?'chat':'welcome';this.render();this.q('textarea').focus();}if(action==='remove-context'){this.context=null;this.renderComposer();}if(action==='attach'||action==='model')this.openMenu(action);if(action==='stop')this.stop();});
 this.root.addEventListener('submit',e=>{if(e.target.matches('.composer')){e.preventDefault();this.send(this.q('textarea').value);}});
 this.root.addEventListener('input',e=>{if(e.target.matches('textarea')){this.draft=e.target.value;e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px';const b=this.q('.send');if(!this.generating)b.disabled=!e.target.value.trim();}if(e.target.matches('input[type="search"]')){this.search=e.target.value;this.renderHistory();}});
 this.root.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.matches('textarea')){e.preventDefault();this.send(e.target.value);}if(e.key==='Escape'){if(this.menu)this.closeMenu();else this.setDrawer(false);}if(e.key==='Tab'&&this.root.classList.contains('drawer-open')){const controls=[...this.q('.sidebar').querySelectorAll('button,input')].filter(x=>x.getClientRects().length);if(e.shiftKey&&document.activeElement===controls[0]){e.preventDefault();controls.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===controls.at(-1)){e.preventDefault();controls[0].focus();}}});
 let start=null;this.root.addEventListener('touchstart',e=>{const t=e.touches[0],r=this.root.getBoundingClientRect();start={x:t.clientX,y:t.clientY,edge:t.clientX-r.left<26,open:this.root.classList.contains('drawer-open')};},{passive:true});this.root.addEventListener('touchend',e=>{if(!start)return;const t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;if(Math.abs(dx)>65&&Math.abs(dy)<65){if(start.open&&dx<0)this.setDrawer(false);else if(start.edge&&dx>0)this.setDrawer(true);}start=null;},{passive:true});
 }
}
apps=[...document.querySelectorAll('.device')].map((el,i)=>new AIApp(el,i));
const styleStorageKey='studypulse-ai-design-style';
function setStyle(style,save=false){
 const choice=style==='warm'?'warm':'blue';
 document.documentElement.dataset.style=choice;
 document.querySelector('meta[name="theme-color"]').content=choice==='blue'?'#ffffff':'#faf9f6';
 document.querySelectorAll('[data-style-choice]').forEach(b=>{const selected=b.dataset.styleChoice===choice;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected));});
 if(save){try{localStorage.setItem(styleStorageKey,choice);}catch{}const url=new URL(location.href);url.searchParams.set('style',choice);try{history.replaceState(null,'',url);}catch{}}
}
let savedStyle;try{savedStyle=localStorage.getItem(styleStorageKey);}catch{}
setStyle(new URLSearchParams(location.search).get('style')||savedStyle||'blue');
document.querySelectorAll('[data-style-choice]').forEach(b=>b.addEventListener('click',()=>setStyle(b.dataset.styleChoice,true)));
document.querySelectorAll('[data-layout]').forEach(b=>b.addEventListener('click',()=>{document.body.classList.toggle('focus',b.dataset.layout==='focus');document.querySelectorAll('[data-layout]').forEach(x=>x.classList.toggle('active',x===b));}));
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{apps[0].preset(b.dataset.scene);document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x===b));}));
document.addEventListener('click',e=>apps.forEach(app=>{if(app.menu&&!e.target.closest('.composer-area'))app.closeMenu();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')apps.forEach(app=>{app.closeMenu();app.setDrawer(false);});});
if(new URLSearchParams(location.search).has('focus'))document.querySelector('[data-layout="focus"]').click();
const initialScene=new URLSearchParams(location.search).get('scene');if(['drawer','grades','chat'].includes(initialScene))apps[0].preset(initialScene);
})();
</script>
</body>
</html>
